[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba_prep_26040826"
version = "0.3.1"
description = "A utility package for cleaning and engineering features for NBA career longevity prediction."
readme = "README.md"
authors = [
    { name = "Aryan Goel" }
]
requires-python = ">=3.7"
dependencies = [
    "numpy",
    "pandas"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
