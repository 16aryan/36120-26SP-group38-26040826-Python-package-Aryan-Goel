[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba_prep_26040826"
version = "0.4.0"
description = "Production utility package for NBA prospect analytics and Weather Intelligence (CCI / WHC) target engineering for MLaaS."
readme = "README.md"
authors = [
    { name = "Aryan Goel" }
]
requires-python = ">=3.8"
keywords = [
    "weather",
    "climate-comfort-index",
    "weather-hazard-category",
    "open-meteo",
    "machine-learning",
    "fastapi",
    "nba-analytics"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn"
]

[project.urls]
Homepage = "https://github.com/16aryan/36120-26SP-group38-26040826-Python-package-Aryan-Goel"
Repository = "https://github.com/16aryan/36120-26SP-group38-26040826-Python-package-Aryan-Goel"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
